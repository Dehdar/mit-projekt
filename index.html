<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotating Sudoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The pictures that stand for the digits, and the star icons. Each picture has its own outline,
       so it can be told apart without colour. Colours come from CSS variables, so the themes can change them. -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="sym-heart" viewBox="0 0 100 100">
      <path style="fill: var(--sym-heart); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round"
        d="M50 88 C20 66 8 48 13 31 C18 14 40 11 50 28 C60 11 82 14 87 31 C92 48 80 66 50 88 Z"/>
    </symbol>
    <symbol id="sym-star" viewBox="0 0 100 100">
      <polygon style="fill: var(--sym-star); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round"
        points="50,6 62,37 95,38 69,58 78,91 50,72 22,91 31,58 5,38 38,37"/>
    </symbol>
    <symbol id="sym-moon" viewBox="0 0 100 100">
      <path style="fill: var(--sym-moon); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round"
        d="M58 8 A43 43 0 1 0 93 64 A34 34 0 0 1 58 8 Z"/>
    </symbol>
    <symbol id="sym-flower" viewBox="0 0 100 100">
      <g style="fill: var(--sym-flower); stroke: var(--symbol-outline); stroke-width: 5">
        <circle cx="50" cy="25" r="17"/>
        <circle cx="74" cy="43" r="17"/>
        <circle cx="65" cy="72" r="17"/>
        <circle cx="35" cy="72" r="17"/>
        <circle cx="26" cy="43" r="17"/>
      </g>
      <circle style="fill: var(--sym-flower-centre); stroke: var(--symbol-outline); stroke-width: 5" cx="50" cy="52" r="13"/>
    </symbol>
    <symbol id="sym-raindrop" viewBox="0 0 100 100">
      <path style="fill: var(--sym-raindrop); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round"
        d="M50 6 C42 22 18 46 18 64 A32 32 0 0 0 82 64 C82 46 58 22 50 6 Z"/>
    </symbol>
    <symbol id="sym-crown" viewBox="0 0 100 100">
      <path style="fill: var(--sym-crown); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round"
        d="M10 74 L14 26 L34 50 L50 16 L66 50 L86 26 L90 74 Z M10 74 L90 74 L90 90 L10 90 Z"/>
    </symbol>
    <symbol id="sym-gem" viewBox="0 0 100 100">
      <g style="fill: var(--sym-gem); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round">
        <polygon points="28,14 72,14 94,40 50,92 6,40"/>
        <polyline style="fill: none" points="6,40 94,40"/>
        <polyline style="fill: none" points="28,14 38,40 50,92 62,40 72,14"/>
      </g>
    </symbol>
    <symbol id="sym-rainbow" viewBox="0 0 100 100">
      <g style="fill: none; stroke-linecap: butt">
        <path style="stroke: var(--symbol-outline); stroke-width: 38" d="M24 80 A26 26 0 0 1 76 80"/>
        <path style="stroke: var(--sym-heart); stroke-width: 10" d="M14 80 A36 36 0 0 1 86 80"/>
        <path style="stroke: var(--sym-star); stroke-width: 10" d="M24 80 A26 26 0 0 1 76 80"/>
        <path style="stroke: var(--sym-raindrop); stroke-width: 10" d="M34 80 A16 16 0 0 1 66 80"/>
      </g>
    </symbol>
    <symbol id="sym-unicorn" viewBox="0 0 100 100">
      <polygon style="fill: var(--sym-unicorn-horn); stroke: var(--symbol-outline); stroke-width: 4; stroke-linejoin: round"
        points="46,26 56,2 60,26"/>
      <path style="fill: var(--sym-unicorn); stroke: var(--symbol-outline); stroke-width: 5; stroke-linejoin: round"
        d="M34 94 L36 62 C26 62 12 58 10 48 C8 40 16 36 24 36 L38 34 C42 26 50 22 58 22 C72 26 82 40 82 56 C82 70 78 84 76 94 Z"/>
      <path style="fill: var(--sym-unicorn-mane); stroke: var(--symbol-outline); stroke-width: 4; stroke-linejoin: round"
        d="M58 22 C76 22 92 38 90 58 C88 72 86 84 86 94 L76 94 C78 84 82 70 82 56 C82 40 72 26 58 22 Z"/>
      <circle style="fill: var(--symbol-outline)" cx="36" cy="44" r="4"/>
    </symbol>
    <symbol id="award-finished" viewBox="0 0 100 100">
      <polygon style="fill: currentColor" points="50,4 62,36 96,37 69,58 79,92 50,72 21,92 31,58 4,37 38,36"/>
      <polyline style="fill: none; stroke: var(--panel); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round"
        points="35,53 46,63 66,42"/>
    </symbol>
    <symbol id="award-careful" viewBox="0 0 100 100">
      <polygon style="fill: currentColor" points="50,4 62,36 96,37 69,58 79,92 50,72 21,92 31,58 4,37 38,36"/>
      <path style="fill: var(--panel)" d="M50 68 C38 59 33 52 35 46 C37 40 45 39 50 45 C55 39 63 40 65 46 C67 52 62 59 50 68 Z"/>
    </symbol>
  </svg>
  <main>
    <header>
      <div class="topbar">
        <button id="how-to-play" class="secondary" data-i18n-label="howToPlay">?</button>
        <button id="lang" class="secondary" data-i18n="otherLang">Dansk</button>
      </div>
      <h1 data-i18n="title">Rotating Sudoku</h1>
      <div class="stats">
        <div class="stat"><span class="label" data-i18n="level">Level</span><span id="level">1 / 20</span></div>
      </div>
    </header>

    <!-- Mochi, the cat who comments on (and disrupts) your game -->
    <div id="mascot" data-mood="curious">
      <div class="mascot-art" aria-hidden="true">
        <svg class="mood mood-curious" viewBox="0 0 240 240">
          <g class="m-q">
            <text x="200" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="40" fill="#2A2230">?</text>
            <circle cx="178" cy="78" r="4" fill="#2A2230"></circle>
            <circle cx="168" cy="92" r="3" fill="#2A2230"></circle>
          </g>
          <g class="m-head">
            <g transform="rotate(-10 120 150)">
              <g stroke="#2A2230" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M56 118 L64 62 L104 96 Z" fill="#FFFFFF"></path>
                <path d="M184 118 L176 62 L136 96 Z" fill="#FFFFFF"></path>
                <path d="M190 176 C216 172 224 146 208 136" fill="none"></path>
                <ellipse cx="120" cy="152" rx="86" ry="66" fill="#FFFFFF"></ellipse>
                <ellipse cx="96" cy="218" rx="14" ry="7" fill="#FFFFFF"></ellipse>
                <ellipse cx="150" cy="218" rx="14" ry="7" fill="#FFFFFF"></ellipse>
              </g>
              <path d="M68 76 L74 100 L90 94 Z" fill="#F49FB0"></path>
              <path d="M172 76 L166 100 L150 94 Z" fill="#F49FB0"></path>
              <ellipse cx="80" cy="168" rx="11" ry="6" fill="#F49FB0"></ellipse>
              <ellipse cx="160" cy="168" rx="11" ry="6" fill="#F49FB0"></ellipse>
              <g fill="none" stroke="#2A2230" stroke-width="4" stroke-linecap="round">
                <path d="M84 144 L106 146"></path>
                <path d="M84 130 L106 136"></path>
                <path d="M134 126 Q146 120 158 126"></path>
                <path d="M112 172 Q120 168 128 172"></path>
              </g>
              <g class="m-look">
                <circle cx="146" cy="142" r="11" fill="#2A2230"></circle>
                <circle cx="150" cy="137" r="3.5" fill="#FFFFFF"></circle>
              </g>
              <path d="M115 157 L125 157 L120 162 Z" fill="#F07C98"></path>
              <g stroke="#2A2230" stroke-width="3" stroke-linecap="round">
                <path d="M56 156 L34 150"></path>
                <path d="M56 166 L34 170"></path>
                <path d="M184 156 L206 150"></path>
              </g>
              <path d="M118 206 C108 196 112 180 126 180 C140 180 146 194 140 204 C134 212 124 212 118 206 Z" fill="#FFFFFF" stroke="#2A2230" stroke-width="4" stroke-linejoin="round"></path>
              <path d="M124 186 L122 193 M133 186 L133 193" stroke="#2A2230" stroke-width="3" stroke-linecap="round"></path>
            </g>
          </g>
        </svg>

        <svg class="mood mood-shocked" viewBox="0 0 240 240">
          <g class="m-lines" stroke="#2A2230" stroke-width="4" stroke-linecap="round">
            <path d="M28 60 L42 74"></path>
            <path d="M20 92 L38 96"></path>
            <path d="M212 60 L198 74"></path>
            <path d="M220 92 L202 96"></path>
            <path d="M120 18 L120 36"></path>
          </g>
          <g class="m-jump">
            <g stroke="#2A2230" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M58 116 L62 48 L104 94 Z" fill="#FFFFFF"></path>
              <path d="M182 116 L178 48 L136 94 Z" fill="#FFFFFF"></path>
              <path d="M190 178 L208 168 L204 186 L222 180" fill="none"></path>
              <ellipse cx="120" cy="150" rx="84" ry="70" fill="#FFFFFF"></ellipse>
              <ellipse cx="92" cy="218" rx="14" ry="7" fill="#FFFFFF"></ellipse>
              <ellipse cx="148" cy="218" rx="14" ry="7" fill="#FFFFFF"></ellipse>
              <circle cx="94" cy="140" r="17" fill="#FFFFFF"></circle>
              <circle cx="146" cy="140" r="17" fill="#FFFFFF"></circle>
            </g>
            <path d="M66 64 L68 98 L90 92 Z" fill="#F49FB0"></path>
            <path d="M174 64 L172 98 L150 92 Z" fill="#F49FB0"></path>
            <circle cx="94" cy="140" r="5" fill="#2A2230"></circle>
            <circle cx="146" cy="140" r="5" fill="#2A2230"></circle>
            <ellipse cx="78" cy="170" rx="10" ry="6" fill="#F49FB0"></ellipse>
            <ellipse cx="162" cy="170" rx="10" ry="6" fill="#F49FB0"></ellipse>
            <path d="M115 160 L125 160 L120 165 Z" fill="#F07C98"></path>
            <ellipse cx="120" cy="184" rx="11" ry="14" fill="#2A2230" stroke="#2A2230" stroke-width="4"></ellipse>
            <ellipse cx="120" cy="190" rx="6" ry="5" fill="#F07C98"></ellipse>
            <g stroke="#2A2230" stroke-width="3" stroke-linecap="round">
              <path d="M56 154 L32 146"></path>
              <path d="M56 166 L32 168"></path>
              <path d="M184 154 L208 146"></path>
              <path d="M184 166 L208 168"></path>
            </g>
            <path class="m-sweat" d="M186 96 C180 108 178 114 184 118 C190 122 196 114 186 96 Z" fill="#9AD4F5" stroke="#2A2230" stroke-width="3" stroke-linejoin="round"></path>
          </g>
        </svg>

        <svg class="mood mood-trash" viewBox="0 0 240 240">
          <g class="m-pop">
            <path d="M150 22 L222 22 Q232 22 232 32 L232 62 Q232 72 222 72 L178 72 L164 86 L166 72 L150 72 Q140 72 140 62 L140 32 Q140 22 150 22 Z" fill="#FFFFFF" stroke="#2A2230" stroke-width="4" stroke-linejoin="round"></path>
            <text x="186" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="24" fill="#2A2230">#@%!</text>
          </g>
          <g class="m-rock">
            <g stroke="#2A2230" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M48 124 L54 72 L98 100 Z" fill="#FFFFFF"></path>
              <path d="M176 108 L184 60 L142 92 Z" fill="#FFFFFF"></path>
              <path d="M40 178 C14 176 8 150 24 140" fill="none"></path>
              <ellipse cx="116" cy="154" rx="84" ry="66" fill="#FFFFFF"></ellipse>
              <ellipse cx="88" cy="218" rx="14" ry="7" fill="#FFFFFF"></ellipse>
              <ellipse cx="144" cy="218" rx="14" ry="7" fill="#FFFFFF"></ellipse>
            </g>
            <path d="M58 86 L62 110 L84 102 Z" fill="#F49FB0"></path>
            <path d="M176 74 L170 98 L152 92 Z" fill="#F49FB0"></path>
            <ellipse cx="74" cy="170" rx="11" ry="6" fill="#F49FB0"></ellipse>
            <ellipse cx="156" cy="170" rx="11" ry="6" fill="#F49FB0"></ellipse>
            <path d="M80 150 Q94 148 108 150 Q100 160 88 158 Z" fill="#2A2230"></path>
            <path d="M126 148 Q140 146 154 148 Q146 158 134 156 Z" fill="#2A2230"></path>
            <circle cx="102" cy="152" r="2" fill="#FFFFFF"></circle>
            <circle cx="148" cy="150" r="2" fill="#FFFFFF"></circle>
            <g fill="none" stroke="#2A2230" stroke-width="4" stroke-linecap="round">
              <path d="M78 150 L110 150"></path>
              <path d="M124 148 L156 148"></path>
              <path d="M82 134 L106 138"></path>
              <path class="m-brow" d="M126 128 Q140 120 154 128"></path>
              <path d="M104 176 Q118 182 134 170"></path>
            </g>
            <path d="M111 163 L121 163 L116 168 Z" fill="#F07C98"></path>
            <g stroke="#2A2230" stroke-width="3" stroke-linecap="round">
              <path d="M52 158 L30 152"></path>
              <path d="M52 168 L30 172"></path>
            </g>
            <g class="m-paw">
              <path d="M158 196 C150 184 154 168 168 166 C182 164 192 176 186 190 C182 200 166 204 158 196 Z" fill="#FFFFFF" stroke="#2A2230" stroke-width="4" stroke-linejoin="round"></path>
              <path d="M166 172 L164 180 M176 170 L176 178" stroke="#2A2230" stroke-width="3" stroke-linecap="round"></path>
            </g>
          </g>
        </svg>
      </div>
      <p id="mascot-bubble" role="status" aria-live="polite"></p>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" data-testid="board"></div>
      <p id="sweep-banner" aria-live="polite"></p>
      <div id="overlay" hidden>
        <div class="overlay-box">
          <h2 id="overlay-title"></h2>
          <p id="overlay-text"></p>
          <ul id="overlay-stars"></ul>
          <button id="overlay-button"></button>
        </div>
      </div>
    </div>

    <div id="numpad" role="group" data-i18n-label="pictures"></div>
    <button id="reset" class="secondary" data-i18n="reset">Reset game</button>
  </main>

  <!-- The first lesson, shown before level 1 on a first visit and replayable from the ? button -->
  <div id="lesson" role="dialog" aria-modal="true" aria-labelledby="lesson-title" hidden>
    <div class="lesson-box">
      <h2 id="lesson-title" data-i18n="lessonTitle">How to play</h2>
      <p class="lesson-hint" data-i18n="lessonHint">Each picture once in every row, column and box</p>
      <div id="lesson-board" class="board lesson-board"></div>
      <div id="lesson-pictures" class="lesson-pictures"></div>
      <div id="lesson-finished" hidden>
        <p class="lesson-cheer" data-i18n="lessonDone">Well done!</p>
        <button id="lesson-play" data-i18n="lessonPlay">Let's play!</button>
      </div>
      <button id="lesson-skip" class="secondary" data-i18n="lessonSkip">Skip</button>
    </div>
  </div>
  <script src="storage.js"></script>
  <script src="dom.js"></script>
  <script src="i18n.js"></script>
  <script src="sudoku.js"></script>
  <script src="symbols.js"></script>
  <script src="cells.js"></script>
  <script src="mascot.js"></script>
  <script src="lesson.js"></script>
  <script src="game.js"></script>
</body>
</html>
